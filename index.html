<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeekGrid — Timetable Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>

    <div class="page">
      <header class="header">
        <div class="brand-block">
          <p class="brand">WeekGrid</p>
          <h1>Your week, mapped out.</h1>
          <p class="subtitle">
            Add a course once, then set different days and times. Saved in this browser.
          </p>
        </div>
        <div class="header-actions">
          <button type="button" class="btn btn-ghost" id="clear-all">
            Clear all
          </button>
        </div>
      </header>

      <section class="form-panel" aria-labelledby="add-class-heading">
        <div class="form-head">
          <h2 id="add-class-heading">Add a class</h2>
          <p class="form-hint">
            Enter the course once, then add one or more days with their own times.
          </p>
        </div>

        <form id="class-form" class="class-form">
          <div class="course-fields">
            <label>
              <span>Course code</span>
              <input
                id="course-code"
                name="courseCode"
                type="text"
                placeholder="CSE101"
                maxlength="20"
                required
                autocomplete="off"
              />
            </label>
            <label class="span-name">
              <span>Course name</span>
              <input
                id="course-name"
                name="courseName"
                type="text"
                placeholder="Data Structures"
                maxlength="80"
                required
                autocomplete="off"
              />
            </label>
          </div>

          <div class="schedule-block">
            <div class="schedule-head">
              <p class="schedule-label">Days &amp; times</p>
              <button type="button" class="btn btn-ghost btn-small" id="add-day-row">
                + Add day
              </button>
            </div>
            <div id="schedule-rows" class="schedule-rows"></div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add class</button>
          </div>
        </form>

        <p id="form-error" class="form-error" hidden></p>
        <p id="form-success" class="form-success" hidden></p>
      </section>

      <main class="timetable-board" id="week-grid" aria-live="polite"></main>
    </div>

    <div id="toast" class="toast" hidden role="status"></div>

    <div id="edit-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="edit-heading"
      >
        <div class="modal-head">
          <h2 id="edit-heading">Edit class</h2>
          <button
            type="button"
            class="btn btn-icon"
            data-close-modal
            aria-label="Close"
          >&times;</button>
        </div>

        <form id="edit-form" class="edit-form">
          <input type="hidden" id="edit-id" />
          <input type="hidden" id="edit-original-day" />

          <div class="course-fields">
            <label>
              <span>Course code</span>
              <input
                id="edit-course-code"
                type="text"
                maxlength="20"
                required
                autocomplete="off"
              />
            </label>
            <label class="span-name">
              <span>Course name</span>
              <input
                id="edit-course-name"
                type="text"
                maxlength="80"
                required
                autocomplete="off"
              />
            </label>
          </div>

          <div class="edit-schedule">
            <label>
              <span>Day</span>
              <select id="edit-day" required>
                <option value="monday">Monday</option>
                <option value="tuesday">Tuesday</option>
                <option value="wednesday">Wednesday</option>
                <option value="thursday">Thursday</option>
                <option value="friday">Friday</option>
                <option value="saturday">Saturday</option>
                <option value="sunday">Sunday</option>
              </select>
            </label>
            <label>
              <span>Start</span>
              <input
                id="edit-start-time"
                type="time"
                min="08:00"
                max="20:00"
                required
              />
            </label>
            <label>
              <span>End</span>
              <input
                id="edit-end-time"
                type="time"
                min="08:00"
                max="20:00"
                required
              />
            </label>
          </div>

          <label class="edit-sync">
            <input type="checkbox" id="edit-sync-code" />
            <span>Also update code &amp; name on other days for this course</span>
          </label>

          <p id="edit-error" class="form-error" hidden></p>

          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close-modal>
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
